<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Stream Marker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dock-container">
    <!-- Header: Stream Title & Status -->
    <header class="header">
      <div class="stream-info">
        <div class="stream-meta">
          <input type="text" id="stream-title-input" class="stream-title" value="My Livestream" placeholder="Stream Title / Category..." title="Click to edit stream title">
          <div class="status-indicator">
            <span id="status-dot" class="status-dot offline"></span>
            <span id="status-text" class="status-label">OFFLINE</span>
          </div>
        </div>
        <div class="timer-display">
          <span class="timer-label">STREAM TIME</span>
          <span id="live-timer" class="timer-digits">00:00:00</span>
        </div>
      </div>

      <!-- Quick Action Controls -->
      <div class="quick-controls">
        <button id="btn-quick-mark" class="btn btn-primary" title="Mark this moment as clippable (or press your OBS hotkey)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
          Mark Clip Point
        </button>
        <div class="lookback-badge" title="Clip pre-roll duration">
          <span>Lookback:</span>
          <strong id="lookback-val">20s</strong>
        </div>
        <button id="btn-sound-toggle" class="btn btn-icon" title="Toggle chime sound">
          <svg id="sound-icon-on" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <svg id="sound-icon-off" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>
      </div>
    </header>

    <!-- Tag Bar for Quick Tag Selection -->
    <div class="tag-bar">
      <span class="tag-bar-label">Next Tag:</span>
      <div class="tag-chips" id="tag-presets">
        <button class="chip active" data-tag="Clip">🎬 Clip</button>
        <button class="chip" data-tag="Clutch">🔥 Clutch</button>
        <button class="chip" data-tag="Funny">😂 Funny</button>
        <button class="chip" data-tag="Kill">🎯 Kill</button>
        <button class="chip" data-tag="Fail">💀 Fail</button>
        <button class="chip" data-tag="Highlight">⭐ Star</button>
      </div>
    </div>

    <!-- Markers List Container -->
    <main class="markers-wrapper">
      <div class="section-title-bar">
        <span class="section-title">STREAM MARKERS (<span id="marker-count">0</span>)</span>
        <button id="btn-clear-all" class="btn btn-text-danger" title="Clear all markers in this session">Clear</button>
      </div>

      <div id="markers-list" class="markers-list">
        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📍</div>
          <p class="empty-title">No Markers Yet</p>
          <p class="empty-sub">Press your <b>OBS Hotkey</b> while streaming or gaming to mark clip points automatically.</p>
        </div>
      </div>
    </main>

    <!-- Footer: Export & Save -->
    <footer class="footer">
      <div class="export-actions">
        <button id="btn-export-txt" class="btn btn-secondary" title="Save markers as TXT file with stream title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          Save TXT
        </button>

        <button id="btn-copy-clipboard" class="btn btn-secondary" title="Copy all markers to clipboard">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy All
        </button>

        <div class="dropdown">
          <button id="btn-export-more" class="btn btn-secondary dropdown-toggle" title="More export formats">
            Formats ▾
          </button>
          <div class="dropdown-menu" id="export-dropdown">
            <button class="dropdown-item" data-format="txt">Standard TXT (Editor notes)</button>
            <button class="dropdown-item" data-format="youtube">YouTube Chapters</button>
            <button class="dropdown-item" data-format="davinci">DaVinci Resolve CSV</button>
            <button class="dropdown-item" data-format="premiere">Premiere Marker EDL</button>
          </div>
        </div>
      </div>
      <div id="toast-notify" class="toast-notify hidden">Saved to markers file!</div>
    </footer>
  </div>

  <script src="markers_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
